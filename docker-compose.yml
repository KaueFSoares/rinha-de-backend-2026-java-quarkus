services:
  lb:
    image: haproxy:alpine
    container_name: lb
    ports:
      - "9999:9999"
    volumes:
      - ./lb.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: "25MB"

  api1:
    image: haproxy:alpine
    container_name: api1
    volumes:
      - ./api.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - core
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "25MB"

  api2:
    image: haproxy:alpine
    container_name: api2
    volumes:
      - ./api.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - core
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "25MB"

  core:
    image: rinha:latest
    container_name: core
    environment:
      - QUARKUS_HTTP_PORT=8080
    deploy:
      resources:
        limits:
          cpus: "0.65"
          memory: "275MB"