global
  maxconn 50000
  daemon

defaults
  mode    http

  timeout connect 1s
  timeout client  15s
  timeout server  15s

  option  http-keep-alive
  option  http-no-delay

frontend http
  bind *:9999
  default_backend apis

backend apis
  balance roundrobin
  http-reuse always

  server api1 api1:80
  server api2 api2:80
